[package]
name = "arachnid-recover-cli"
description = "Arachnid Recover: file carving and filesystem-aware recovery from images and read-only devices."
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "arachnid-recover"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arachnid-evidence.workspace = true
arachnid-recover-core.workspace = true
arachnid-sanitize-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3.15"

[package]
name = "arachnid-core-cli"
description = "Arachnid Core: live triage and network forensics for authorized DFIR use."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "arachnid-core"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arachnid-collect.workspace = true
arachnid-evidence.workspace = true
arachnid-netcap.workspace = true
arachnid-report.workspace = true
serde_json.workspace = true
tracing.workspace = true
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

name: Release

# Tag-driven. Nothing here runs on a normal push: a release is a deliberate act,
# and the artifacts it produces are what the installer and `self update` will
# hand people, sight unseen, as a forensic tool.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The version of libpcap built from source for the targets that need it.
  # Pinned, and its digest checked below: a release binary must not depend on
  # whatever tcpdump.org served that morning.
  PCAP_VERSION: "1.10.5"
  PCAP_SHA256: "37ced90a19a302a7f32e458224a00c365c117905c2cd35ac544b6880a81488f0"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # Both macOS slices build on the arm64 image: macos-13 is retired, and
          # Apple's toolchain cross-compiles to x86_64 from arm64 without help.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # --- libpcap ---------------------------------------------------------
      #
      # `arachnid-netcap` links libpcap, so every target needs one for its own
      # architecture and libc. macOS ships it. Windows needs the Npcap SDK's
      # import library. Linux gets the distro package where the host matches,
      # and a source build where it does not — no distribution ships a musl or
      # cross-arch libpcap.

      - name: libpcap (native glibc)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: libpcap (musl, from source)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools linux-libc-dev
          # musl-gcc compiles with -nostdinc and adds only musl's own headers, so
          # the kernel headers libpcap needs are invisible to it —
          # pcap-linux.c stops at `linux/if.h: No such file or directory`.
          #
          # Link the kernel headers into musl's include directory rather than
          # putting /usr/include on the include path, which would drag glibc's
          # headers in alongside musl's and produce a far more confusing failure.
          for d in linux asm-generic; do
            sudo ln -sfn "/usr/include/$d" "/usr/include/x86_64-linux-musl/$d"
          done
          sudo ln -sfn /usr/include/x86_64-linux-gnu/asm \
                       /usr/include/x86_64-linux-musl/asm
          ./.github/scripts/build-libpcap.sh musl-gcc "$PWD/pcap-prefix"
          echo "LIBPCAP_LIBDIR=$PWD/pcap-prefix/lib" >> "$GITHUB_ENV"
          echo "LIBPCAP_VER=$PCAP_VERSION" >> "$GITHUB_ENV"

      - name: libpcap (aarch64 cross, from source)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          ./.github/scripts/build-libpcap.sh aarch64-linux-gnu-gcc "$PWD/pcap-prefix" aarch64-linux-gnu
          echo "LIBPCAP_LIBDIR=$PWD/pcap-prefix/lib" >> "$GITHUB_ENV"
          echo "LIBPCAP_VER=$PCAP_VERSION" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Npcap SDK
        if: runner.os == 'Windows'
        run: |
          curl -fsSLO https://npcap.com/dist/npcap-sdk-1.13.zip
          Expand-Archive npcap-sdk-1.13.zip -DestinationPath $env:RUNNER_TEMP\npcap-sdk
          "LIB=$env:RUNNER_TEMP\npcap-sdk\Lib\x64;$env:LIB" >> $env:GITHUB_ENV

      # --- build -----------------------------------------------------------

      - name: Build
        shell: bash
        env:
          # Stamped into the binary so `version` and `doctor` can name the
          # commit an artifact came from, and so a support question does not
          # start with "which build is that".
          ARACHNID_BUILD_HASH: ${{ github.sha }}
          # The public half of the release key, embedded so `self update` can
          # verify a download without fetching its own trust anchor.
          ARACHNID_MINISIGN_PUBKEY: ${{ vars.MINISIGN_PUBKEY }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p arachnid-cli

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/arachnid-cli.exe" \
               "dist/arachnid-cli-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/arachnid-cli" \
               "dist/arachnid-cli-${{ matrix.target }}"
          fi

      # The tool must stay inspectable — no packing, no obfuscation. If our own
      # subcommand names are not visible to `strings`, something in the pipeline
      # is hiding the binary from the analysts we ask to allowlist it.
      # grep -a rather than `strings | grep -q`. Two reasons, both learned the
      # hard way on the first run: `grep -q` exits at the first match and
      # SIGPIPEs `strings`, which Xcode's copy reports as "failed to flush
      # output" and which `-o pipefail` then turns into a failed step. And it
      # drops a dependency on which `strings` implementation the runner ships.
      # grep -a tests the same property directly: our own subcommand names are
      # present as literal bytes, so the binary is not packed or obfuscated.
      - name: Verify the binary is inspectable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin=$(ls dist/arachnid-cli-*)
          missing=0
          for marker in collect recover sanitize doctor "Arachnid Forensic"; do
            if grep -aqF "$marker" "$bin"; then
              echo "  found: $marker"
            else
              echo "  MISSING: $marker" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "The release build must stay readable to the analysts we ask to" >&2
            echo "allowlist it. Something in the pipeline is hiding it." >&2
            exit 1
          fi
          echo "inspectable: confirmed"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # One job collects every artifact, hashes them together, and signs the digest
  # file once. Signing each binary separately would mean six signatures to check
  # instead of one, and the installer would have to fetch a different one per
  # platform.
  publish:
    name: checksums, signature, release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Flatten
        run: |
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          ls -l dist

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum arachnid-cli-* > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set. A release without a signature is" \
                 "one the installer will refuse to install; see release/README.md."
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key

          # Trailing whitespace is the classic way this secret goes wrong:
          # `gh secret set` keeps whatever reached its stdin, so a stray newline
          # or a copied trailing space becomes part of the password and minisign
          # answers "Wrong password for that key" with no hint as to why.
          password="$(printf '%s' "$MINISIGN_PASSWORD" | tr -d '\r\n')"

          # Legacy (non-prehashed) mode: a plain Ed25519 signature over the file,
          # which `arachnid-cli self update` verifies with ed25519-dalek rather
          # than carrying a second hash implementation. Do not add -H.
          if ! printf '%s\n' "$password" \
                | minisign -S -s minisign.key -m dist/SHA256SUMS \
                    -t "arachnid-forensic ${{ github.event.inputs.tag || github.ref_name }}"
          then
            shred -u minisign.key
            echo "::error::Signing failed. If minisign said \"Wrong password for that key\"," \
                 "MINISIGN_PASSWORD does not match the key in MINISIGN_SECRET_KEY." \
                 "Re-set it with:  gh secret set MINISIGN_PASSWORD --repo ${{ github.repository }}" \
                 "and paste the password with no trailing newline (Ctrl-D on the same line)."
            exit 1
          fi
          shred -u minisign.key

          # Verify what we just produced, with the same public key the installers
          # and `self update` pin. A release that cannot verify against the
          # published key is worse than no release.
          minisign -Vm dist/SHA256SUMS -P "${{ vars.MINISIGN_PUBKEY }}"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber

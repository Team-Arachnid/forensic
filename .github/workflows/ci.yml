name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # The Npcap SDK provides the wpcap import library, which is all the link
      # step needs. The Npcap runtime is deliberately not installed: wpcap.dll
      # is delay-loaded (see .cargo/config.toml), so the binary starts without
      # it and every test that does not touch pcap runs normally. That also
      # makes CI a standing check that the no-Npcap path works, which is how
      # most analyst workstations are configured.
      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSLO https://npcap.com/dist/npcap-sdk-1.13.zip
          Expand-Archive npcap-sdk-1.13.zip -DestinationPath $env:RUNNER_TEMP\npcap-sdk
          "LIB=$env:RUNNER_TEMP\npcap-sdk\Lib\x64;$env:LIB" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # Typecheck the Windows collectors from Linux too, so a change to the
  # cfg(windows) modules cannot merge on the strength of a Linux build alone.
  cross-check:
    name: cross typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: Swatinem/rust-cache@v2
      # clippy, not check: lints that only fire on cfg(windows) code are
      # invisible to a Linux build, and waiting for the windows-latest job to
      # find them costs a full CI round trip.
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Supply chain. An accidental dependency that could phone home, load code
  # dynamically, or carry a known vulnerability fails the build here rather
  # than shipping to a responder's endpoint.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  schema:
    name: schemas match output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: Swatinem/rust-cache@v2
      - run: pip install jsonschema
      - name: Validate a real container against the published schemas
        run: |
          cargo run --release -p arachnid-core-cli -- \
            --log-level warn collect -o ./ci-container --no-hash-binaries
          python3 scripts/validate-schemas.py ./ci-container

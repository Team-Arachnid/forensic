name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No RUSTFLAGS here: the env var *replaces* target.*.rustflags from
  # .cargo/config.toml rather than adding to it, which silently dropped
  # /DELAYLOAD:wpcap.dll and +crt-static on Windows. Warnings are denied via
  # clippy's own `-- -D warnings`, which is appended instead.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # The Npcap SDK provides the wpcap import library, which is all the link
      # step needs. The Npcap runtime is deliberately not installed: wpcap.dll
      # is delay-loaded (see .cargo/config.toml), so the binary starts without
      # it and every test that does not touch pcap runs normally. That also
      # makes CI a standing check that the no-Npcap path works, which is how
      # most analyst workstations are configured.
      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSLO https://npcap.com/dist/npcap-sdk-1.13.zip
          Expand-Archive npcap-sdk-1.13.zip -DestinationPath $env:RUNNER_TEMP\npcap-sdk
          "LIB=$env:RUNNER_TEMP\npcap-sdk\Lib\x64;$env:LIB" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The erasure engine, its safety rails and its pattern sequences run
      # against file-backed virtual devices, so they need no attached disk and
      # no elevation. Called out separately from the workspace run so a failure
      # here is legible as "a safety rail broke" rather than one line in a
      # hundred — this is the suite that stands between an operator and the
      # wrong drive.
      - name: Safety rails (virtual devices)
        run: cargo test -p arachnid-sanitize-core --test safety_rails

  # Typecheck the Windows collectors from Linux too, so a change to the
  # cfg(windows) modules cannot merge on the strength of a Linux build alone.
  cross-check:
    name: cross typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: Swatinem/rust-cache@v2
      # clippy, not check: lints that only fire on cfg(windows) code are
      # invisible to a Linux build, and waiting for the windows-latest job to
      # find them costs a full CI round trip. Now also covers the Windows
      # device-enumeration and raw-device ioctl paths in arachnid-sanitize-core.
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Supply chain. An accidental dependency that could phone home, load code
  # dynamically, or carry a known vulnerability fails the build here rather
  # than shipping to a responder's endpoint.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The wiki is a separate git repository, so merging a docs change publishes
  # nothing on its own. It drifted five commits behind main before this job
  # existed. The Pages site needs no job: GitHub builds it from main/docs itself.
  wiki:
    name: publish wiki
    if: github.event_name == 'push'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sync docs/wiki to the GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: ./scripts/publish-wiki.sh

  schema:
    name: schemas match output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: Swatinem/rust-cache@v2
      - run: pip install jsonschema
      - name: Validate a real container against the published schemas
        run: |
          cargo run --release -p arachnid-core-cli -- \
            --log-level warn collect -o ./ci-container --no-hash-binaries
          python3 scripts/validate-schemas.py ./ci-container
